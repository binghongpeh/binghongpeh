<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Three.js Receipt Physics UI</title>
  <style>
    :root {
      --bg: #ffffff;
      --ink: #202124;
      --sub: #6b7280;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      color: var(--ink);
    }

    #app {
      position: fixed;
      inset: 0;
      cursor: grab;
    }

    #app.dragging {
      cursor: grabbing;
    }

    .hud {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.82);
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 999px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      padding: 8px 14px;
      font-size: 12px;
      line-height: 1.2;
      backdrop-filter: blur(6px);
      user-select: none;
      pointer-events: none;
      white-space: nowrap;
    }

    .hud b { color: #111827; }
    .hud span { color: var(--sub); }
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="hud"><b>左键</b>抓取并拖拽小票 · 可自然弯曲/折叠/回弹 <span>（顶部整条约束为刚性直线）</span></div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js';

    // ---------- Renderer / Scene ----------
    const container = document.getElementById('app');
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xffffff);

    const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.01, 20);
    camera.position.set(0, 0.2, 2.0);

    // ---------- Lighting ----------
    const hemi = new THREE.HemisphereLight(0xffffff, 0xf2f2f2, 0.85);
    scene.add(hemi);

    const key = new THREE.DirectionalLight(0xffffff, 1.05);
    key.position.set(1.2, 1.9, 1.4);
    key.castShadow = true;
    key.shadow.mapSize.set(1024, 1024);
    key.shadow.camera.near = 0.1;
    key.shadow.camera.far = 6;
    key.shadow.camera.left = -1.2;
    key.shadow.camera.right = 1.2;
    key.shadow.camera.top = 1.2;
    key.shadow.camera.bottom = -1.2;
    scene.add(key);

    const fill = new THREE.DirectionalLight(0xffffff, 0.3);
    fill.position.set(-1.2, 0.8, 1.2);
    scene.add(fill);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(6, 6),
      new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.95, metalness: 0.0 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -1.05;
    floor.receiveShadow = true;
    scene.add(floor);

    // ---------- Receipt Texture (thermal paper style + funny list) ----------
    function makeReceiptTexture() {
      const c = document.createElement('canvas');
      c.width = 1024;
      c.height = 1536;
      const ctx = c.getContext('2d');

      // Slightly warm thermal paper tint
      ctx.fillStyle = '#fbfaf5';
      ctx.fillRect(0, 0, c.width, c.height);

      // subtle noise/grain
      const img = ctx.getImageData(0, 0, c.width, c.height);
      const d = img.data;
      for (let i = 0; i < d.length; i += 4) {
        const n = (Math.random() - 0.5) * 8;
        d[i] += n;
        d[i + 1] += n;
        d[i + 2] += n * 0.8;
      }
      ctx.putImageData(img, 0, 0);

      // faded top header band
      ctx.fillStyle = 'rgba(0,0,0,0.035)';
      ctx.fillRect(80, 70, c.width - 160, 80);

      ctx.fillStyle = '#1e1e1e';
      ctx.font = 'bold 48px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.fillText('3D TERMINOLOGY MART', c.width / 2, 132);

      ctx.font = '30px "Courier New", monospace';
      ctx.fillText('THERMAL RECEIPT', c.width / 2, 188);
      ctx.textAlign = 'left';

      ctx.font = '28px "Courier New", monospace';
      ctx.fillText('--------------------------------------------', 95, 258);
      ctx.fillText('QTY  ITEM                     PRICE', 110, 304);
      ctx.fillText('--------------------------------------------', 95, 346);

      const lines = [
        ['2', 'Normal Map 薯片', '$3.20'],
        ['1', 'Phong 光照奶茶', '$5.50'],
        ['4', 'Bezier 曲线薯条', '$7.80'],
        ['1', 'LOD 折扣盲盒', '$2.40'],
        ['3', 'UV 展开饼干', '$6.66'],
        ['1', 'Raycast 抓娃娃券', '$1.20'],
        ['2', 'PBR 真实感豆腐', '$8.88'],
        ['1', 'Quaternion 旋转糖', '$4.44'],
        ['5', 'Vertex 顶点汤圆', '$9.99'],
      ];

      let y = 402;
      for (const row of lines) {
        ctx.fillText(row[0], 120, y);
        ctx.fillText(row[1], 180, y);
        ctx.fillText(row[2], 780, y);
        y += 86;
      }

      ctx.fillText('--------------------------------------------', 95, y + 10);
      ctx.font = 'bold 34px "Courier New", monospace';
      ctx.fillText('TOTAL', 130, y + 90);
      ctx.fillText('$50.07', 760, y + 90);

      ctx.font = '26px "Courier New", monospace';
      ctx.fillText('Render Pass: APPROVED', 130, y + 165);
      ctx.fillText('FPS: 60 (希望如此)', 130, y + 212);
      ctx.fillText('NO REFUNDS ON NAN VALUES', 130, y + 260);
      ctx.fillText('THANK YOU, SEE YOU IN SHADERLAND!', 130, y + 330);

      // subtle vertical streaks common on thermal prints
      for (let i = 0; i < 18; i++) {
        const x = 80 + Math.random() * (c.width - 160);
        const alpha = 0.02 + Math.random() * 0.03;
        ctx.fillStyle = `rgba(0,0,0,${alpha})`;
        ctx.fillRect(x, 70, 1 + Math.random() * 2, c.height - 120);
      }

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      tex.needsUpdate = true;
      return tex;
    }

    // ---------- Verlet cloth receipt ----------
    const SEG_X = 22;         // width particles
    const SEG_Y = 38;         // height particles
    const WIDTH = 0.62;
    const HEIGHT = 1.15;
    const DX = WIDTH / SEG_X;
    const DY = HEIGHT / SEG_Y;

    const GRAVITY = new THREE.Vector3(0, -9.0, 0);
    const DRAG = 0.985;
    const BOUNCE = 0.16;
    const ITERATIONS = 6;
    const BEND_STIFFNESS = 0.28;
    const STRUCT_STIFFNESS = 0.96;

    class Particle {
      constructor(x, y, pinned = false) {
        this.pos = new THREE.Vector3(x, y, 0);
        this.prev = this.pos.clone();
        this.acc = new THREE.Vector3();
        this.pinned = pinned;
      }

      addForce(f) { this.acc.add(f); }

      integrate(dt2) {
        if (this.pinned) {
          this.acc.set(0, 0, 0);
          this.prev.copy(this.pos);
          return;
        }
        const vel = this.pos.clone().sub(this.prev).multiplyScalar(DRAG);
        this.prev.copy(this.pos);
        this.pos.add(vel).addScaledVector(this.acc, dt2);
        this.acc.set(0, 0, 0);
      }
    }

    const particles = [];
    const idx = (x, y) => y * (SEG_X + 1) + x;

    const originTopY = HEIGHT * 0.5;
    const originTopX = -WIDTH * 0.5;

    for (let y = 0; y <= SEG_Y; y++) {
      for (let x = 0; x <= SEG_X; x++) {
        const px = -WIDTH * 0.5 + x * DX;
        const py = HEIGHT * 0.5 - y * DY;
        // Entire top edge is pinned => full straight edge constraint
        particles.push(new Particle(px, py, y === 0));
      }
    }

    const constraints = [];
    function addConstraint(a, b, rest, stiff) {
      constraints.push({ a, b, rest, stiff });
    }

    for (let y = 0; y <= SEG_Y; y++) {
      for (let x = 0; x <= SEG_X; x++) {
        if (x < SEG_X) addConstraint(idx(x, y), idx(x + 1, y), DX, STRUCT_STIFFNESS);
        if (y < SEG_Y) addConstraint(idx(x, y), idx(x, y + 1), DY, STRUCT_STIFFNESS);
        // shear
        if (x < SEG_X && y < SEG_Y) {
          addConstraint(idx(x, y), idx(x + 1, y + 1), Math.hypot(DX, DY), 0.6);
          addConstraint(idx(x + 1, y), idx(x, y + 1), Math.hypot(DX, DY), 0.6);
        }
        // bend (2-step)
        if (x < SEG_X - 1) addConstraint(idx(x, y), idx(x + 2, y), DX * 2, BEND_STIFFNESS);
        if (y < SEG_Y - 1) addConstraint(idx(x, y), idx(x, y + 2), DY * 2, BEND_STIFFNESS);
      }
    }

    const geo = new THREE.PlaneGeometry(WIDTH, HEIGHT, SEG_X, SEG_Y);
    const mat = new THREE.MeshStandardMaterial({
      map: makeReceiptTexture(),
      side: THREE.DoubleSide,
      roughness: 0.9,
      metalness: 0.0,
      envMapIntensity: 0.15
    });

    const receipt = new THREE.Mesh(geo, mat);
    receipt.position.set(0, 0.02, 0);
    receipt.castShadow = true;
    receipt.receiveShadow = false;
    scene.add(receipt);

    const posAttr = geo.attributes.position;

    // ---------- Interaction ----------
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const dragPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
    const tempHit = new THREE.Vector3();
    const app = document.getElementById('app');

    let grabbed = null;
    let grabOffset = new THREE.Vector3();

    function setMouse(e) {
      const r = renderer.domElement.getBoundingClientRect();
      mouse.x = ((e.clientX - r.left) / r.width) * 2 - 1;
      mouse.y = -((e.clientY - r.top) / r.height) * 2 + 1;
    }

    function findNearestParticle(worldPoint) {
      let best = null;
      let minD2 = 0.012 * 0.012;
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        if (p.pinned) continue; // top edge cannot be grabbed, keep edge perfect
        const d2 = p.pos.distanceToSquared(worldPoint);
        if (d2 < minD2) {
          minD2 = d2;
          best = i;
        }
      }
      return best;
    }

    renderer.domElement.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      setMouse(e);
      raycaster.setFromCamera(mouse, camera);
      if (!raycaster.ray.intersectPlane(dragPlane, tempHit)) return;

      const local = receipt.worldToLocal(tempHit.clone());
      const i = findNearestParticle(local);
      if (i !== null) {
        grabbed = i;
        grabOffset.copy(particles[i].pos).sub(local);
        app.classList.add('dragging');
      }
    });

    renderer.domElement.addEventListener('pointermove', (e) => {
      if (grabbed === null) return;
      setMouse(e);
      raycaster.setFromCamera(mouse, camera);
      if (!raycaster.ray.intersectPlane(dragPlane, tempHit)) return;

      const local = receipt.worldToLocal(tempHit.clone());
      const target = local.add(grabOffset);
      const p = particles[grabbed];

      // Verlet-friendly dragging: move current, keep prev near for smooth swing
      const move = target.clone().sub(p.pos);
      p.pos.addScaledVector(move, 0.72);
      p.prev.addScaledVector(move, 0.45);

      // induce local fold / wrinkle by moving neighbors with falloff
      const gx = grabbed % (SEG_X + 1);
      const gy = Math.floor(grabbed / (SEG_X + 1));
      for (let oy = -2; oy <= 2; oy++) {
        for (let ox = -2; ox <= 2; ox++) {
          const nx = gx + ox;
          const ny = gy + oy;
          if (nx < 0 || nx > SEG_X || ny < 1 || ny > SEG_Y) continue;
          const ni = idx(nx, ny);
          if (ni === grabbed) continue;
          const q = particles[ni];
          const dist = Math.hypot(ox, oy);
          const inf = Math.max(0, 1 - dist / 3);
          const zKick = (Math.random() - 0.5) * 0.0025 * inf;
          q.pos.z += zKick;
          q.prev.z -= zKick * 0.5;
          q.pos.addScaledVector(move, 0.1 * inf);
        }
      }
    });

    window.addEventListener('pointerup', () => {
      grabbed = null;
      app.classList.remove('dragging');
    });

    window.addEventListener('pointercancel', () => {
      grabbed = null;
      app.classList.remove('dragging');
    });

    // ---------- Solver ----------
    function satisfy(c) {
      const p1 = particles[c.a];
      const p2 = particles[c.b];
      const delta = p2.pos.clone().sub(p1.pos);
      let len = delta.length();
      if (len < 1e-6) len = 1e-6;
      const diff = (len - c.rest) / len;
      const corr = delta.multiplyScalar(0.5 * diff * c.stiff);

      if (!p1.pinned) p1.pos.add(corr);
      if (!p2.pinned) p2.pos.sub(corr);
    }

    function enforceTopRigidLine() {
      // Hard-constraint entire top edge as a straight horizontal line.
      // This prevents any middle sagging/"clothesline" effect.
      for (let x = 0; x <= SEG_X; x++) {
        const p = particles[idx(x, 0)];
        p.pos.set(originTopX + x * DX, originTopY, 0);
        p.prev.copy(p.pos);
      }
    }

    const clock = new THREE.Clock();
    let acc = 0;
    const FIXED = 1 / 60;

    function step(dt) {
      const dt2 = dt * dt;

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        p.addForce(GRAVITY);
        // tiny air jitter for natural micro wrinkles
        if (!p.pinned) {
          p.acc.x += (Math.random() - 0.5) * 0.2;
          p.acc.z += (Math.random() - 0.5) * 0.4;
        }
        p.integrate(dt2);

        // floor collision
        if (p.pos.y < -0.98) {
          p.pos.y = -0.98;
          const vy = p.prev.y - p.pos.y;
          p.prev.y = p.pos.y - vy * BOUNCE;
        }
      }

      // stronger solver passes keep paper shape stable while lower part remains soft
      for (let k = 0; k < ITERATIONS; k++) {
        for (let i = 0; i < constraints.length; i++) satisfy(constraints[i]);
        enforceTopRigidLine();
      }
    }

    function syncGeometry() {
      const arr = posAttr.array;
      for (let y = 0; y <= SEG_Y; y++) {
        for (let x = 0; x <= SEG_X; x++) {
          const i = idx(x, y);
          const p = particles[i].pos;
          const j = i * 3;
          arr[j] = p.x;
          arr[j + 1] = p.y;
          arr[j + 2] = p.z;
        }
      }
      posAttr.needsUpdate = true;
      geo.computeVertexNormals();
    }

    // ---------- Render loop ----------
    function animate() {
      requestAnimationFrame(animate);

      // fixed time-step for stable cloth behavior and consistent performance
      acc += Math.min(clock.getDelta(), 0.033);
      while (acc >= FIXED) {
        step(FIXED);
        acc -= FIXED;
      }

      syncGeometry();
      renderer.render(scene, camera);
    }
    animate();

    // ---------- Resize ----------
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
