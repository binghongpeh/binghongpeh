<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Hay Day 3D Farm</title>
  <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #87CEEB; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    #c { display: block; width: 100vw; height: 100vh; touch-action: none; }

    /* ── HUD overlay ── */
    #ui {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      display: flex; flex-direction: column; justify-content: space-between;
    }

    /* Top bar */
    .hud-top {
      pointer-events: auto;
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 14px;
      background: linear-gradient(135deg, rgba(139,69,19,0.92), rgba(160,82,45,0.92));
      border-bottom: 3px solid rgba(80,40,0,0.7);
      backdrop-filter: blur(6px);
    }
    .hud-top h1 { color: #FFE066; font-size: 1.15rem; text-shadow: 1px 1px 2px #3d1a00; letter-spacing: 0.5px; }
    .hud-stats  { display: flex; gap: 10px; }
    .stat-pill  {
      background: rgba(0,0,0,0.28); border: 2px solid; border-radius: 18px;
      padding: 3px 11px; font-size: 0.88rem; font-weight: bold;
      display: flex; align-items: center; gap: 4px;
    }
    .stat-pill.coins { border-color: #FFD700; color: #FFD700; }
    .stat-pill.milk  { border-color: #ADE8F4; color: #D0F4FF; }
    .hint-bar {
      pointer-events: none;
      text-align: center; padding: 3px 0;
      font-size: 0.72rem; font-weight: bold; color: rgba(255,248,220,0.85);
      background: rgba(80,40,0,0.5);
      letter-spacing: 0.5px;
    }

    /* Bottom panel */
    .hud-bottom { pointer-events: auto; }
    .tab-bar {
      display: flex;
      background: rgba(75,38,0,0.88);
      border-top: 2px solid rgba(92,46,0,0.6);
    }
    .tab {
      flex: 1; padding: 7px 2px; border: none; background: transparent;
      color: rgba(255,255,255,0.55); font-size: 0.72rem; font-weight: bold;
      cursor: pointer; transition: color 0.15s; border-top: 3px solid transparent;
    }
    .tab.active { color: #FFE066; border-top-color: #FFE066; }
    .panel-content {
      display: none; padding: 9px 11px;
      background: linear-gradient(135deg, rgba(222,184,135,0.96), rgba(195,155,100,0.96));
      border-top: 2px solid #8B6347;
      backdrop-filter: blur(8px);
    }
    .panel-content.active { display: block; }
    .panel-hint { font-size: 0.65rem; font-weight: bold; color: #5C3D20; margin-bottom: 6px; letter-spacing: 0.5px; }

    /* Item cards */
    .item-row { display: flex; gap: 7px; flex-wrap: wrap; }
    .item-card {
      flex: 1; min-width: 66px; max-width: 95px;
      background: rgba(255,248,231,0.92); border: 2px solid #8B6347; border-radius: 9px;
      padding: 5px 3px; text-align: center; cursor: pointer; position: relative;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .item-card:hover  { transform: translateY(-2px); box-shadow: 0 3px 8px rgba(0,0,0,0.2); }
    .item-card:active { transform: translateY(0); }
    .item-card.selected { border-color: #FF8C00; background: #FFF0C0; box-shadow: 0 0 0 2px #FF8C00; }
    .item-card.disabled { opacity: 0.38; cursor: not-allowed; pointer-events: none; }
    .item-card .ic-emoji { font-size: 1.45rem; display: block; }
    .item-card .ic-name  { font-size: 0.58rem; font-weight: bold; color: #5C3D20; }
    .item-card .ic-info  { font-size: 0.56rem; color: #8B4513; }
    .item-card .ic-badge {
      position: absolute; top: 2px; right: 4px;
      font-size: 0.58rem; font-weight: bold; color: #2E7D32;
    }
    .action-btn {
      display: block; width: 100%; margin-top: 7px; padding: 7px;
      border: 2px solid #8B4500; border-radius: 7px; background: #CC6600;
      color: #FFE066; font-weight: bold; font-size: 0.82rem; cursor: pointer;
      transition: background 0.1s;
    }
    .action-btn:hover    { background: #E07000; }
    .action-btn:disabled { opacity: 0.38; cursor: not-allowed; }

    /* Toast */
    #toast {
      position: fixed; bottom: 110px; left: 50%;
      transform: translateX(-50%) translateY(14px);
      background: rgba(30,14,0,0.9); color: #FFE066;
      padding: 8px 18px; border-radius: 18px;
      font-size: 0.85rem; font-weight: bold;
      opacity: 0; transition: opacity 0.28s, transform 0.28s;
      pointer-events: none; z-index: 9999; white-space: nowrap;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
<canvas id="c"></canvas>

<div id="ui">
  <div>
    <div class="hud-top">
      <h1>🌻 Hay Day 3D</h1>
      <div class="hud-stats">
        <div class="stat-pill coins">💰 <span id="val-coins">100</span></div>
        <div class="stat-pill milk">🥛 <span id="val-milk">0</span></div>
      </div>
    </div>
    <div class="hint-bar">🖱 Drag to rotate • Scroll to zoom • Click farm tiles or cows</div>
  </div>

  <div class="hud-bottom">
    <div class="tab-bar">
      <button class="tab active" onclick="setTab('plant')">🌱 Plant</button>
      <button class="tab"        onclick="setTab('buy')">🏪 Shop</button>
      <button class="tab"        onclick="setTab('sell')">💰 Sell</button>
      <button class="tab"        onclick="setTab('animals')">🐄 Animals</button>
    </div>

    <div class="panel-content active" id="tab-plant">
      <div class="panel-hint">SELECT SEED → CLICK A BROWN FARM TILE TO PLANT</div>
      <div class="item-row" id="plant-seeds"></div>
    </div>

    <div class="panel-content" id="tab-buy">
      <div class="panel-hint">BUY 5 SEEDS AT A TIME</div>
      <div class="item-row" id="buy-seeds"></div>
    </div>

    <div class="panel-content" id="tab-sell">
      <div class="panel-hint">YOUR HARVEST INVENTORY</div>
      <div class="item-row" id="sell-inv"></div>
      <button class="action-btn" id="sell-all-btn" onclick="sellAll()">Sell All Crops</button>
    </div>

    <div class="panel-content" id="tab-animals">
      <div class="panel-hint">CLICK GLOWING COW TO COLLECT MILK (PRODUCES EVERY 60s)</div>
      <div class="item-row">
        <div class="item-card" style="cursor:default">
          <span class="ic-emoji">🐄</span>
          <span class="ic-name">Cows</span>
          <span class="ic-info" id="cow-count-lbl">3 / 5</span>
        </div>
        <div class="item-card" style="cursor:default">
          <span class="ic-emoji">🥛</span>
          <span class="ic-name">Milk</span>
          <span class="ic-info">💰 25 each</span>
        </div>
        <div class="item-card" id="buy-cow-card" onclick="buyCow()">
          <span class="ic-emoji">🐄</span>
          <span class="ic-name">Buy Cow</span>
          <span class="ic-info">💰 150</span>
        </div>
        <div class="item-card" onclick="sellMilk()">
          <span class="ic-emoji">🥛</span>
          <span class="ic-name">Sell Milk</span>
          <span class="ic-info" id="milk-sell-lbl">0 milk</span>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ═══════════════════════════════════════════════════════════
// CROP DATA
// ═══════════════════════════════════════════════════════════
const CROPS = {
  wheat:      { name:'Wheat',      emoji:'🌾', growTime:15000, sell:8,  cost:3  },
  corn:       { name:'Corn',       emoji:'🌽', growTime:30000, sell:20, cost:8  },
  carrot:     { name:'Carrot',     emoji:'🥕', growTime:60000, sell:40, cost:15 },
  strawberry: { name:'Strawberry', emoji:'🍓', growTime:90000, sell:65, cost:25 },
};

// ═══════════════════════════════════════════════════════════
// GAME STATE
// ═══════════════════════════════════════════════════════════
const FCOLS = 5, FROWS = 4;
const state = {
  coins: 100, milk: 0,
  seeds:     { wheat:5, corn:0, carrot:0, strawberry:0 },
  inventory: { wheat:0, corn:0, carrot:0, strawberry:0 },
  farm:      Array(FCOLS * FROWS).fill(null),
  cows:      [],
  selectedCrop: 'wheat',
};

// ═══════════════════════════════════════════════════════════
// THREE.JS SETUP
// ═══════════════════════════════════════════════════════════
const canvas   = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type    = THREE.PCFSoftShadowMap;

const scene  = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.Fog(0x87CEEB, 50, 90);

const camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(2, 20, 26);
camera.lookAt(2, 0, 2);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping  = true;
controls.dampingFactor  = 0.08;
controls.minDistance    = 8;
controls.maxDistance    = 50;
controls.maxPolarAngle  = Math.PI / 2.05;
controls.target.set(2, 0, 2);

// ── Lighting ──────────────────────────────────────────────
scene.add(new THREE.HemisphereLight(0xFFF5CC, 0x2D6A1E, 0.65));
const sun = new THREE.DirectionalLight(0xFFFAE0, 1.25);
sun.position.set(12, 22, 12);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { near:0.5, far:80, left:-30, right:30, top:30, bottom:-30 });
sun.shadow.bias = -0.001;
scene.add(sun);

// ═══════════════════════════════════════════════════════════
// TERRAIN
// ═══════════════════════════════════════════════════════════
const mkMesh = (geo, mat, rx=0, ry=0, rz=0, x=0, y=0, z=0, shadow=true) => {
  const m = new THREE.Mesh(geo, mat);
  m.rotation.set(rx, ry, rz);
  m.position.set(x, y, z);
  if (shadow) { m.castShadow = true; m.receiveShadow = true; }
  scene.add(m);
  return m;
};

// Grass ground
mkMesh(new THREE.PlaneGeometry(100, 100),
       new THREE.MeshLambertMaterial({ color: 0x5D9E3A }),
       -Math.PI/2, 0, 0, 0, 0, 0);

// Dirt path between farm and pen
mkMesh(new THREE.PlaneGeometry(1.8, 34),
       new THREE.MeshLambertMaterial({ color: 0xBFA06A }),
       -Math.PI/2, 0, 0, 4.6, 0.01, 0);

// ── Clouds ────────────────────────────────────────────────
const clouds = [];
function makeCloud(x, y, z) {
  const g   = new THREE.Group();
  const mat = new THREE.MeshLambertMaterial({ color: 0xFFFFFF });
  [[0,0,0,1.6,0.7,1.0],[1.3,0.3,0,1.1,0.6,0.9],[-1.2,0.2,0,1.0,0.55,0.85]].forEach(([cx,cy,cz,sw,sh,sd]) => {
    const s = new THREE.Mesh(new THREE.SphereGeometry(1, 7, 5), mat);
    s.scale.set(sw, sh, sd); s.position.set(cx, cy, cz);
    g.add(s);
  });
  g.position.set(x, y, z);
  scene.add(g);
  clouds.push({ g, spd: 0.003 + Math.random() * 0.004 });
}
[[-16,15,-12],[6,17,-16],[20,14,-6],[-4,16,18]].forEach(([x,y,z]) => makeCloud(x,y,z));

// ═══════════════════════════════════════════════════════════
// FARM GRID
// ═══════════════════════════════════════════════════════════
const TSTEP  = 2.2;
const FARM0X = -((FCOLS-1)*TSTEP)/2 - 3.2;
const FARM0Z = -((FROWS-1)*TSTEP)/2;

const tileMeshes = [];
const cropMeshes = Array(FCOLS * FROWS).fill(null);

function tilePos(idx) {
  const col = idx % FCOLS, row = Math.floor(idx / FCOLS);
  return new THREE.Vector3(FARM0X + col*TSTEP, 0, FARM0Z + row*TSTEP);
}

// Farm base platform
const baseW = FCOLS*TSTEP + 0.6, baseD = FROWS*TSTEP + 0.6;
mkMesh(new THREE.BoxGeometry(baseW, 0.18, baseD),
       new THREE.MeshLambertMaterial({ color: 0x6B4226 }),
       0, 0, 0,
       FARM0X + (FCOLS-1)*TSTEP/2, -0.09, FARM0Z + (FROWS-1)*TSTEP/2);

// Farm label sign
function makeSignPost(text, x, z) {
  const g = new THREE.Group();
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.07,1.8,7), new THREE.MeshLambertMaterial({color:0x8D5524}));
  post.position.y = 0.9; post.castShadow = true;
  g.add(post);
  const board = new THREE.Mesh(new THREE.BoxGeometry(1.6,0.55,0.12), new THREE.MeshLambertMaterial({color:0xDEB887}));
  board.position.y = 1.8;
  g.add(board);
  g.position.set(x, 0, z);
  scene.add(g);
}
makeSignPost('FARM', FARM0X - 1.4, FARM0Z - 1.4);

for (let i = 0; i < FCOLS * FROWS; i++) {
  const pos  = tilePos(i);
  const tile = new THREE.Mesh(
    new THREE.BoxGeometry(2.0, 0.28, 2.0),
    new THREE.MeshLambertMaterial({ color: 0x8B6347 })
  );
  tile.position.set(pos.x, 0.14, pos.z);
  tile.castShadow = tile.receiveShadow = true;
  tile.userData = { type:'farmTile', index:i };
  scene.add(tile);
  tileMeshes.push(tile);
}

// ── Crop 3D models ────────────────────────────────────────
function buildCropMesh(type, stage) {
  const g  = new THREE.Group();
  const h  = 0.15 + stage * 0.32;

  if (type === 'wheat') {
    const stemColor = stage < 2 ? 0x4CAF50 : 0xF5C542;
    const headColor = stage < 2 ? 0x4CAF50 : 0xF5A000;
    const count     = stage === 0 ? 3 : 7;
    const sM = new THREE.MeshLambertMaterial({ color: stemColor });
    const hM = new THREE.MeshLambertMaterial({ color: headColor });
    for (let i = 0; i < count; i++) {
      const a = (i/count)*Math.PI*2, r = stage === 0 ? 0 : 0.28;
      const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.035, h, 5), sM);
      stem.position.set(Math.cos(a)*r, h/2, Math.sin(a)*r);
      g.add(stem);
      if (stage === 2) {
        const head = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.065, 0.24, 5), hM);
        head.position.set(Math.cos(a)*r, h + 0.12, Math.sin(a)*r);
        g.add(head);
      }
    }
  } else if (type === 'corn') {
    const stalkM = new THREE.MeshLambertMaterial({ color: 0x33691E });
    const stalk  = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.1, h, 6), stalkM);
    stalk.position.y = h/2; g.add(stalk);
    if (stage >= 1) {
      const leafM = new THREE.MeshLambertMaterial({ color: 0x558B2F, side: THREE.DoubleSide });
      [-0.3, 0.3].forEach(ez => {
        const leaf = new THREE.Mesh(new THREE.PlaneGeometry(0.65, 0.22), leafM);
        leaf.position.set(ez > 0 ? 0.28 : -0.28, h*0.55, 0);
        leaf.rotation.z = ez > 0 ? -0.5 : 0.5; g.add(leaf);
      });
    }
    if (stage === 2) {
      const earM = new THREE.MeshLambertMaterial({ color: 0xFFD600 });
      const ear  = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.08, 0.38, 8), earM);
      ear.position.set(0.18, h*0.68, 0); ear.rotation.z = -0.35; g.add(ear);
    }
  } else if (type === 'carrot') {
    const leafM = new THREE.MeshLambertMaterial({ color: 0x4CAF50 });
    const count = stage === 0 ? 3 : 6;
    for (let i = 0; i < count; i++) {
      const a = (i/count)*Math.PI*2;
      const leaf = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.01, h*0.85, 4), leafM);
      leaf.position.set(Math.cos(a)*0.1, h*0.42, Math.sin(a)*0.1);
      leaf.rotation.z = Math.cos(a)*0.4; leaf.rotation.x = Math.sin(a)*0.4;
      g.add(leaf);
    }
    if (stage === 2) {
      const carrotM = new THREE.MeshLambertMaterial({ color: 0xFF6D00 });
      const carrot  = new THREE.Mesh(new THREE.ConeGeometry(0.11, 0.52, 7), carrotM);
      carrot.position.y = 0.12; carrot.rotation.x = Math.PI; g.add(carrot);
    }
  } else { // strawberry
    const leafM  = new THREE.MeshLambertMaterial({ color: 0x4CAF50 });
    const plant  = new THREE.Mesh(new THREE.SphereGeometry(0.26, 7, 5), leafM);
    plant.scale.y = 0.45 + stage*0.25; plant.position.y = plant.scale.y*0.26; g.add(plant);
    if (stage >= 1) {
      const flowerM = new THREE.MeshLambertMaterial({ color: 0xFFFFFF });
      const flower  = new THREE.Mesh(new THREE.SphereGeometry(0.07, 5, 4), flowerM);
      flower.position.set(0.22, plant.position.y + 0.15, 0); g.add(flower);
    }
    if (stage === 2) {
      const berryM = new THREE.MeshLambertMaterial({ color: 0xF44336 });
      for (let i = 0; i < 4; i++) {
        const a = (i/4)*Math.PI*2;
        const b = new THREE.Mesh(new THREE.SphereGeometry(0.1, 6, 5), berryM);
        b.position.set(Math.cos(a)*0.22, plant.position.y + 0.1, Math.sin(a)*0.22);
        g.add(b);
      }
    }
  }
  return g;
}

function placeCrop(idx) {
  if (cropMeshes[idx]) { scene.remove(cropMeshes[idx]); cropMeshes[idx] = null; }
  const cell = state.farm[idx];
  if (!cell) { tileMeshes[idx].material.color.setHex(0x8B6347); return; }
  const pct   = Math.min(1, (Date.now() - cell.plantedAt) / CROPS[cell.type].growTime);
  const stage = pct >= 1 ? 2 : pct >= 0.5 ? 1 : 0;
  const mesh  = buildCropMesh(cell.type, stage);
  const pos   = tilePos(idx);
  mesh.position.set(pos.x, 0.28, pos.z);
  mesh.userData = { type:'crop', index:idx, stage };
  mesh.traverse(c => { if (c.isMesh) c.userData = { type:'crop', index:idx }; });
  scene.add(mesh);
  cropMeshes[idx] = mesh;
  tileMeshes[idx].material.color.setHex(pct >= 1 ? 0x6AB04C : 0x7A8A50);
}

// ═══════════════════════════════════════════════════════════
// COW PEN
// ═══════════════════════════════════════════════════════════
const PEN_CX = 8.5, PEN_CZ = 1.5, PEN_W = 7.5, PEN_D = 7.5;

function buildPen() {
  // Mud floor
  mkMesh(new THREE.PlaneGeometry(PEN_W, PEN_D),
         new THREE.MeshLambertMaterial({ color: 0x9E7C52 }),
         -Math.PI/2, 0, 0, PEN_CX, 0.01, PEN_CZ);

  // Hay patches
  const hayM = new THREE.MeshLambertMaterial({ color: 0xD4A827 });
  [[-1.5,-1.5],[1.5,1.5],[-1.5,1.5]].forEach(([ox,oz]) => {
    const hay = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.12, 7), hayM);
    hay.position.set(PEN_CX+ox, 0.06, PEN_CZ+oz);
    hay.receiveShadow = true; scene.add(hay);
  });

  // Water trough
  const troughG = new THREE.Group();
  const trough  = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.35, 0.55), new THREE.MeshLambertMaterial({color:0x7B5533}));
  trough.position.y = 0.175; troughG.add(trough);
  const water = new THREE.Mesh(new THREE.BoxGeometry(1.15, 0.12, 0.38), new THREE.MeshLambertMaterial({color:0x29B6F6}));
  water.position.y = 0.3; troughG.add(water);
  troughG.position.set(PEN_CX, 0, PEN_CZ - PEN_D/2 + 0.8);
  scene.add(troughG);

  buildFence(PEN_CX - PEN_W/2, PEN_CZ - PEN_D/2, PEN_W, PEN_D);
  makeSignPost('COW PEN', PEN_CX - PEN_W/2 - 0.5, PEN_CZ - PEN_D/2 - 0.5);
}

function buildFence(x0, z0, w, d) {
  const postM = new THREE.MeshLambertMaterial({ color: 0x8D5524 });
  const railM = new THREE.MeshLambertMaterial({ color: 0xAA7744 });
  const corners = [[x0,z0],[x0+w,z0],[x0+w,z0+d],[x0,z0+d]];
  for (let s = 0; s < 4; s++) {
    const [ax,az] = corners[s], [bx,bz] = corners[(s+1)%4];
    const dx = bx-ax, dz = bz-az, len = Math.hypot(dx,dz);
    const steps = Math.ceil(len / 1.5);
    for (let i = 0; i <= steps; i++) {
      const t  = i/steps;
      const post = new THREE.Mesh(new THREE.CylinderGeometry(0.075,0.075,1.3,7), postM);
      post.position.set(ax+dx*t, 0.65, az+dz*t);
      post.castShadow = true; scene.add(post);
    }
    const angle = Math.atan2(dz, dx);
    const mx = (ax+bx)/2, mz = (az+bz)/2;
    [0.72, 0.38].forEach(ry => {
      const rail = new THREE.Mesh(new THREE.BoxGeometry(len, 0.08, 0.08), railM);
      rail.position.set(mx, ry, mz); rail.rotation.y = angle; scene.add(rail);
    });
  }
}

buildPen();

// ── Cow model ─────────────────────────────────────────────
function makeCow() {
  const g     = new THREE.Group();
  const cream = new THREE.MeshLambertMaterial({ color: 0xF0EAD6 });
  const black = new THREE.MeshLambertMaterial({ color: 0x282828 });
  const pink  = new THREE.MeshLambertMaterial({ color: 0xFFB6C1 });
  const dkbrn = new THREE.MeshLambertMaterial({ color: 0xA0724A });

  // Body
  const body = new THREE.Mesh(new THREE.BoxGeometry(1.5,0.82,0.82), cream);
  body.position.y = 0.88; body.castShadow = true; g.add(body);
  // Black patches
  const p1 = new THREE.Mesh(new THREE.BoxGeometry(0.52,0.84,0.84), black);

  // Horns
  [-0.2,0.2].forEach(ez => {

  // Legs
  [[0.48,0.3,0.26],[-0.48,0.3,0.26],[0.48,0.3,-0.26],[-0.48,0.3,-0.26]].forEach(([lx,ly,lz]) => {

    const hoof = new THREE.Mesh(new THREE.BoxGeometry(0.24,0.14,0.24), black);

}

function addCow() {
  const cow   = makeCow();
  const angle = (state.cows.length / 5) * Math.PI * 2;
  cow.position.set(PEN_CX + Math.cos(angle)*1.8, 0, PEN_CZ + Math.sin(angle)*1.8);
  cow.rotation.y = -angle + Math.PI;
  scene.add(cow);
  // Assign click userData to each mesh child (not the group, to preserve stored refs)
  const cidx = state.cows.length;
  cow.userData.type = 'cow'; cow.userData.cowIndex = cidx;
  cow.traverse(c => { if (c.isMesh) { c.userData.type = 'cow'; c.userData.cowIndex = cidx; } });
  state.cows.push({
    mesh: cow, hasMilk: false,
    lastMilkTime: Date.now() - Math.random()*40000,
    target: new THREE.Vector3(PEN_CX + (Math.random()-0.5)*5, 0, PEN_CZ + (Math.random()-0.5)*5),
    walkSpd: 0.015 + Math.random()*0.01,
    phase: Math.random()*Math.PI*2,
  });
}
addCow(); addCow(); addCow(); // start with 3

// BARN
// ═══════════════════════════════════════════════════════════
function buildBarn() {
  const BX = -13, BZ = -1.5;
  const barnG = new THREE.Group();

  // Walls
  const walls = new THREE.Mesh(new THREE.BoxGeometry(5.5,3.2,4.2), new THREE.MeshLambertMaterial({color:0xC0392B}));
  walls.position.y = 1.6; walls.castShadow = walls.receiveShadow = true; barnG.add(walls);

  // White trim
  const trim = new THREE.Mesh(new THREE.BoxGeometry(5.6,0.18,4.3), new THREE.MeshLambertMaterial({color:0xECF0F1}));
  trim.position.y = 3.2; barnG.add(trim);

  // Roof (extruded triangle)
  const shape = new THREE.Shape();
  shape.moveTo(-3, 0); shape.lineTo(3, 0); shape.lineTo(0, 1.9); shape.closePath();
  const roofMesh = new THREE.Mesh(
    new THREE.ExtrudeGeometry(shape, { depth:4.4, bevelEnabled:false }),
    new THREE.MeshLambertMaterial({ color: 0x962B22 })
  );
  roofMesh.rotation.x = Math.PI/2;
  roofMesh.position.set(-3, 3.17, 2.2);
  roofMesh.castShadow = true; barnG.add(roofMesh);

  // Door
  const door = new THREE.Mesh(new THREE.BoxGeometry(1.4,2.2,0.12), new THREE.MeshLambertMaterial({color:0x6D4C41}));
  door.position.set(0,1.1,2.16); barnG.add(door);
  // Door frame
  const frame = new THREE.Mesh(new THREE.BoxGeometry(1.55,2.35,0.08), new THREE.MeshLambertMaterial({color:0x5D3C2A}));
  frame.position.set(0,1.17,2.17); barnG.add(frame);

  // Windows
  [-1.7,1.7].forEach(wx => {
    const win = new THREE.Mesh(new THREE.BoxGeometry(0.9,0.9,0.1), new THREE.MeshLambertMaterial({color:0xADE8F4}));
    win.position.set(wx, 2.2, 2.16); barnG.add(win);
  });

  barnG.position.set(BX, 0, BZ);
  barnG.traverse(c => { if (c.isMesh) c.receiveShadow = true; });
  scene.add(barnG);

  // Silo
  const siloG = new THREE.Group();
  const sbody = new THREE.Mesh(new THREE.CylinderGeometry(1.05,1.05,4.5,14), new THREE.MeshLambertMaterial({color:0xBDC3C7}));
  sbody.position.y = 2.25; sbody.castShadow = sbody.receiveShadow = true; siloG.add(sbody);
  // Metal bands
  [0.8,1.8,2.8].forEach(sy => {
    const band = new THREE.Mesh(new THREE.CylinderGeometry(1.07,1.07,0.12,14), new THREE.MeshLambertMaterial({color:0x95A5A6}));
    band.position.y = sy; siloG.add(band);
  });
  const sCap = new THREE.Mesh(new THREE.ConeGeometry(1.1,1.4,14), new THREE.MeshLambertMaterial({color:0x7F8C8D}));
  sCap.position.y = 5.2; siloG.add(sCap);
  siloG.position.set(BX + 4, 0, BZ);
  scene.add(siloG);
}
buildBarn();

function makeTree(x, z, h=3) {
  const g = new THREE.Group();

  trunk.position.y = h*0.19; trunk.castShadow = true; g.add(trunk);
  const leafCol = [0x2E7D32,0x388E3C,0x43A047,0x1B5E20][Math.floor(Math.random()*4)];

  scene.add(g);
}

// ═══════════════════════════════════════════════════════════
// RAYCASTING / CLICK HANDLING
// ═══════════════════════════════════════════════════════════
const raycaster = new THREE.Raycaster();
const mouse     = new THREE.Vector2();
let isDown = false, dragged = false, downAt = { x:0, y:0 };

canvas.addEventListener('pointerdown', e => {
  isDown = true; dragged = false; downAt = { x:e.clientX, y:e.clientY };
});
canvas.addEventListener('pointermove', e => {
  if (!isDown) return;
  if (Math.hypot(e.clientX-downAt.x, e.clientY-downAt.y) > 5) dragged = true;
});
canvas.addEventListener('pointerup', e => {
  if (!isDown || dragged) { isDown = false; return; }
  isDown = false;
  mouse.x =  (e.clientX / window.innerWidth)  * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(scene.children, true);
  for (const h of hits) {
    const ud = h.object.userData;
    if (ud.type === 'farmTile' || ud.type === 'crop') { onFarmClick(ud.index); return; }
    if (ud.type === 'cow') { onCowClick(ud.cowIndex); return; }
  }
});

function onFarmClick(i) {
  const cell = state.farm[i];
  if (!cell) {
    if (state.seeds[state.selectedCrop] <= 0) {
      toast(`No ${CROPS[state.selectedCrop].name} seeds! Visit the Shop tab.`);
      return;
    }
    state.seeds[state.selectedCrop]--;
    state.farm[i] = { type: state.selectedCrop, plantedAt: Date.now() };
    placeCrop(i);
    toast(`Planted ${CROPS[state.selectedCrop].name}! 🌱`);
    renderUI();
  } else {
    const pct = Math.min(1, (Date.now() - cell.plantedAt) / CROPS[cell.type].growTime);
    if (pct < 1) {
      toast(`${CROPS[cell.type].name} growing… ${Math.ceil(CROPS[cell.type].growTime*(1-pct)/1000)}s left`);
      return;
    }
    state.inventory[cell.type]++;
    state.farm[i] = null;
    scene.remove(cropMeshes[i]); cropMeshes[i] = null;
    tileMeshes[i].material.color.setHex(0x8B6347);
    toast(`Harvested ${CROPS[cell.type].name}! 🎉`);
    renderUI();
  }
}

function onCowClick(idx) {
  if (idx >= state.cows.length) return;
  const cow = state.cows[idx];
  if (!cow.hasMilk) {
    const wait = Math.ceil((60000 - (Date.now() - cow.lastMilkTime)) / 1000);
    toast(`Cow needs ${wait}s more 🐄`);
    return;
  }
  cow.hasMilk = false;
  cow.lastMilkTime = Date.now();
  cow.mesh.userData.milkOrb.material.opacity = 0;
  state.milk++;
  toast(`Collected milk! 🥛`);
  renderUI();
}

// ═══════════════════════════════════════════════════════════
// GAME ACTIONS
// ═══════════════════════════════════════════════════════════
function sellAll() {
  const total = Object.values(state.inventory).reduce((a,b)=>a+b,0);
  if (!total) { toast('Nothing to sell!'); return; }
  let earned = 0;
  Object.entries(state.inventory).forEach(([k,v]) => { earned += v * CROPS[k].sell; state.inventory[k] = 0; });
  state.coins += earned;
  toast(`Sold all crops for 💰${earned}!`);
  renderUI();
}

function sellMilk() {
  if (!state.milk) { toast('No milk to sell!'); return; }
  const earned = state.milk * 25;
  state.coins += earned; state.milk = 0;
  toast(`Sold milk for 💰${earned}!`);
  renderUI();
}

function buyCow() {
  if (state.cows.length >= 5) { toast('Cow pen full! (max 5)'); return; }
  if (state.coins < 150) { toast('Need 💰150 to buy a cow!'); return; }
  state.coins -= 150;
  addCow();
  toast('New cow added! 🐄');
  renderUI();
}

// ═══════════════════════════════════════════════════════════
// UI RENDERING
// ═══════════════════════════════════════════════════════════
function setTab(tab) {
  const keys = ['plant','buy','sell','animals'];
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', keys[i]===tab));
  document.querySelectorAll('.panel-content').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  renderUI();
}

function renderUI() {
  document.getElementById('val-coins').textContent = state.coins;
  document.getElementById('val-milk').textContent  = state.milk;
  document.getElementById('cow-count-lbl').textContent = `${state.cows.length} / 5 cows`;
  document.getElementById('milk-sell-lbl').textContent = `${state.milk} milk`;
  document.getElementById('buy-cow-card').className = 'item-card' + (state.cows.length>=5||state.coins<150 ? ' disabled' : '');

  // Plant tab
  const plantEl = document.getElementById('plant-seeds');
  plantEl.innerHTML = '';
  Object.entries(CROPS).forEach(([k,c]) => {
    const d = document.createElement('div');
    d.className = `item-card${state.selectedCrop===k?' selected':''}${state.seeds[k]===0?' disabled':''}`;
    d.innerHTML = `<span class="ic-badge">${state.seeds[k]}</span><span class="ic-emoji">${c.emoji}</span><span class="ic-name">${c.name}</span><span class="ic-info">${c.growTime/1000}s</span>`;
    d.addEventListener('click', () => { state.selectedCrop = k; renderUI(); });
    plantEl.appendChild(d);
  });

  // Buy tab
  const buyEl = document.getElementById('buy-seeds');
  buyEl.innerHTML = '';
  Object.entries(CROPS).forEach(([k,c]) => {
    const total = c.cost * 5;
    const d = document.createElement('div');
    d.className = `item-card${state.coins<total?' disabled':''}`;
    d.innerHTML = `<span class="ic-emoji">${c.emoji}</span><span class="ic-name">${c.name} x5</span><span class="ic-info">💰${total}</span>`;
    d.addEventListener('click', () => {
      if (state.coins < total) { toast('Not enough coins!'); return; }
      state.coins -= total; state.seeds[k] += 5;
      toast(`Bought 5 ${c.name} seeds! 🌱`); renderUI();
    });
    buyEl.appendChild(d);
  });

  // Sell tab
  const sellEl = document.getElementById('sell-inv');
  sellEl.innerHTML = '';
  Object.entries(CROPS).forEach(([k,c]) => {
    const d = document.createElement('div');
    d.className = 'item-card'; d.style.cursor = 'default';
    d.innerHTML = `<span class="ic-emoji">${c.emoji}</span><span class="ic-name">${c.name}</span><span class="ic-info">x${state.inventory[k]} • 💰${c.sell}ea</span>`;
    sellEl.appendChild(d);
  });
  const totalEarn = Object.entries(state.inventory).reduce((s,[k,v])=>s+v*CROPS[k].sell,0);
  const sellBtn = document.getElementById('sell-all-btn');
  sellBtn.textContent = totalEarn > 0 ? `Sell All for 💰${totalEarn}` : 'Nothing to Sell';
  sellBtn.disabled = totalEarn === 0;
}

// ═══════════════════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════════════════
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

// ═══════════════════════════════════════════════════════════
// RESIZE
// ═══════════════════════════════════════════════════════════
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ═══════════════════════════════════════════════════════════
// GAME LOOP
// ═══════════════════════════════════════════════════════════
let lastCropCheck = 0, prevT = performance.now();

function updateCrops() {
  state.farm.forEach((cell, i) => {
    if (!cell) return;
    const pct   = Math.min(1, (Date.now() - cell.plantedAt) / CROPS[cell.type].growTime);
    const stage = pct >= 1 ? 2 : pct >= 0.5 ? 1 : 0;
    const prev  = cropMeshes[i] ? cropMeshes[i].userData.stage : -1;
    if (stage !== prev) placeCrop(i);
  });
}

function updateCows(dt, t) {
  const now = Date.now();
  state.cows.forEach((cow, i) => {
    // Milk production
    if (!cow.hasMilk && now - cow.lastMilkTime >= 60000) {
      cow.hasMilk = true;
      cow.mesh.userData.milkOrb.material.opacity = 0.88;
      toast('A cow has milk ready! 🥛 Click to collect');
      renderUI();
    }

    // Walk toward target
    const pos = cow.mesh.position, tgt = cow.target;
    const dx = tgt.x - pos.x, dz = tgt.z - pos.z, dist = Math.hypot(dx, dz);
    if (dist > 0.12) {
      pos.x += (dx/dist) * cow.walkSpd * dt * 60;
      pos.z += (dz/dist) * cow.walkSpd * dt * 60;
      cow.mesh.rotation.y = Math.atan2(dx, dz);
      cow.mesh.position.y = Math.abs(Math.sin((t + cow.phase) * 4)) * 0.04;
      // Head bob
      if (cow.mesh.userData.head) cow.mesh.userData.head.rotation.x = Math.sin((t+cow.phase)*4)*0.06;
      // Tail wag
      if (cow.mesh.userData.tail) cow.mesh.userData.tail.rotation.z = 0.55 + Math.sin((t+cow.phase)*2)*0.3;
    } else {
      // New random target in pen
      cow.target.set(
        PEN_CX + (Math.random()-0.5)*(PEN_W-1.6),
        0,
        PEN_CZ + (Math.random()-0.5)*(PEN_D-1.6)
      );
    }

    // Milk orb float
    if (cow.hasMilk) cow.mesh.userData.milkOrb.position.y = 2.1 + Math.sin(t*2 + i)*0.12;
  });
}

function updateClouds() {
  clouds.forEach(c => {
    c.g.position.x += c.spd;
    if (c.g.position.x > 35) c.g.position.x = -35;
  });
}

function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt  = Math.min((now - prevT) / 1000, 0.1);
  const t   = now / 1000;
  prevT = now;

  controls.update();
  updateCows(dt, t);
  updateClouds();

  // Crop stage check every 2s
  if (now - lastCropCheck > 2000) { updateCrops(); lastCropCheck = now; }

  renderer.render(scene, camera);
}

// ── Init ──────────────────────────────────────────────────
renderUI();
animate();
</script>
