<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PawFit Dogwear Shop</title>
  <style>
    :root {
      --bg: #fff7f1;
      --card: #ffffff;
      --text: #2f2a27;
      --subtle: #6a5f58;
      --brand: #ff7f50;
      --brand-dark: #e4683b;
      --border: #f1d7c9;
      --good: #2f9e44;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 28px 14px;
    }

    .container {
      max-width: 980px;
      margin: 0 auto;
      display: grid;
      gap: 18px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.06);
      padding: 20px;
    }

    h1 {
      font-size: 1.9rem;
      margin-bottom: 6px;
    }

    .subtitle {
      color: var(--subtle);
      margin-bottom: 8px;
    }

    .search-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }

    input,
    select,
    button {
      border-radius: 10px;
      border: 1px solid #e9ddd5;
      padding: 10px 12px;
      font-size: 0.96rem;
    }

    input,
    select {
      flex: 1;
      min-width: 180px;
      background: #fff;
    }

    button {
      background: var(--brand);
      color: white;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover {
      background: var(--brand-dark);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px;
    }

    .dog-item,
    .wear-item {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      background: #fffdfa;
    }

    .dog-name,
    .wear-name {
      font-weight: 700;
      margin-bottom: 4px;
    }

    .meta {
      color: var(--subtle);
      font-size: 0.92rem;
      margin-bottom: 8px;
    }

    .tag {
      display: inline-block;
      font-size: 0.8rem;
      padding: 4px 8px;
      border-radius: 20px;
      background: #ffe4d6;
      color: #8a4328;
      margin-right: 6px;
      margin-top: 4px;
    }

    .dogwear-controls {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 10px;
      margin-bottom: 12px;
    }

    .result-box {
      border: 1px dashed #f0cdb8;
      border-radius: 12px;
      padding: 14px;
      background: #fffdf9;
      color: var(--subtle);
    }

    .result-box strong {
      color: var(--good);
    }

    @media (max-width: 700px) {
      .dogwear-controls {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>🐾 PawFit Dogwear Shop</h1>
      <p class="subtitle">Simple starter: search dogs, choose one, then pick dogwear that fits.</p>
      <div class="search-row">
        <input id="dogSearch" type="text" placeholder="Search dog species (e.g., Husky, Poodle)" />
      </div>
    </section>

    <section class="card">
      <h2>Choose Your Dog</h2>
      <div class="grid" id="dogList"></div>
    </section>

    <section class="card">
      <h2>Pick Dogwear</h2>
      <div class="dogwear-controls">
        <select id="selectedDog">
          <option value="">Select your dog</option>
        </select>
        <select id="selectedWear">
          <option value="">Select dogwear</option>
        </select>
        <button id="matchBtn">Match Outfit</button>
      </div>
      <div class="grid" id="wearList"></div>
      <div class="result-box" id="resultBox">Choose a dog and a dogwear item to get a simple recommendation.</div>
    </section>
  </main>

  <script>
    const dogs = [
      { id: 'd1', species: 'Golden Retriever', size: 'L', style: ['outdoor', 'classic'] },
      { id: 'd2', species: 'French Bulldog', size: 'M', style: ['urban', 'cozy'] },
      { id: 'd3', species: 'Pomeranian', size: 'S', style: ['cute', 'warm'] },
      { id: 'd4', species: 'Siberian Husky', size: 'L', style: ['sport', 'cold weather'] },
      { id: 'd5', species: 'Toy Poodle', size: 'S', style: ['fashion', 'lightweight'] },
      { id: 'd6', species: 'Beagle', size: 'M', style: ['active', 'all-round'] }
    ];

    const wears = [
      { id: 'w1', name: 'Waterproof Rain Jacket', fitSizes: ['M', 'L'], bestFor: 'rainy walks' },
      { id: 'w2', name: 'Knitted Winter Sweater', fitSizes: ['S', 'M'], bestFor: 'cold evenings' },
      { id: 'w3', name: 'Breathable Summer Tee', fitSizes: ['S', 'M', 'L'], bestFor: 'sunny days' },
      { id: 'w4', name: 'Reflective Sport Vest', fitSizes: ['M', 'L'], bestFor: 'night exercise' },
      { id: 'w5', name: 'Bow Tie Party Collar', fitSizes: ['S', 'M'], bestFor: 'events and photos' },
      { id: 'w6', name: 'Puffer Hoodie', fitSizes: ['L'], bestFor: 'winter trips' }
    ];

    const dogList = document.getElementById('dogList');
    const wearList = document.getElementById('wearList');
    const dogSearch = document.getElementById('dogSearch');
    const selectedDog = document.getElementById('selectedDog');
    const selectedWear = document.getElementById('selectedWear');
    const matchBtn = document.getElementById('matchBtn');
    const resultBox = document.getElementById('resultBox');

    function renderDogs(filterText = '') {
      const term = filterText.trim().toLowerCase();
      const filtered = dogs.filter(d => d.species.toLowerCase().includes(term));

      dogList.innerHTML = filtered.length
        ? filtered.map(d => `
            <article class="dog-item">
              <div class="dog-name">${d.species}</div>
              <div class="meta">Size: ${d.size}</div>
              ${d.style.map(tag => `<span class="tag">${tag}</span>`).join('')}
            </article>
          `).join('')
        : '<p>No dog species found. Try another keyword.</p>';
    }

    function renderWears() {
      wearList.innerHTML = wears.map(w => `
        <article class="wear-item">
          <div class="wear-name">${w.name}</div>
          <div class="meta">Best for: ${w.bestFor}</div>
          <div class="meta">Sizes: ${w.fitSizes.join(', ')}</div>
        </article>
      `).join('');
    }

    function populateSelects() {
      dogs.forEach(d => {
        const option = document.createElement('option');
        option.value = d.id;
        option.textContent = `${d.species} (${d.size})`;
        selectedDog.appendChild(option);
      });

      wears.forEach(w => {
        const option = document.createElement('option');
        option.value = w.id;
        option.textContent = w.name;
        selectedWear.appendChild(option);
      });
    }

    function getRecommendation() {
      const dog = dogs.find(d => d.id === selectedDog.value);
      const wear = wears.find(w => w.id === selectedWear.value);

      if (!dog || !wear) {
        resultBox.innerHTML = 'Please select both a dog and a dogwear item first.';
        return;
      }

      const match = wear.fitSizes.includes(dog.size);
      if (match) {
        resultBox.innerHTML = `<strong>Great match!</strong> ${wear.name} fits ${dog.species} (size ${dog.size}) and is ideal for ${wear.bestFor}.`;
      } else {
        resultBox.innerHTML = `<strong>Size mismatch.</strong> ${wear.name} is for sizes ${wear.fitSizes.join(', ')}, but ${dog.species} is size ${dog.size}. Try another dogwear.`;
      }
    }

    dogSearch.addEventListener('input', (event) => {
      renderDogs(event.target.value);
    });

    matchBtn.addEventListener('click', getRecommendation);

    renderDogs();
    renderWears();
    populateSelects();
  </script>
</body>
</html>
