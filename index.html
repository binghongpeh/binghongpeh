<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Snake Game</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #eee;
      touch-action: none;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }

    .game-container {
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 2rem;
      color: #00d4aa;
    }

    .score-board {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-bottom: 12px;
      font-size: 1.1rem;
    }

    .score-board span {
      color: #00d4aa;
      font-weight: bold;
    }

    canvas {
      border: 2px solid #00d4aa;
      border-radius: 4px;
      background: #16213e;
      display: block;
      margin: 0 auto;
    }

    .instructions {
      margin-top: 14px;
      font-size: 0.9rem;
      color: #888;
    }

    .overlay {
      position: absolute;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.75);
      border-radius: 4px;
      z-index: 10;
      pointer-events: none;
    }

    .overlay h2 {
      font-size: 1.8rem;
      margin-bottom: 8px;
    }

    .overlay p {
      font-size: 1rem;
      color: #ccc;
    }

    .overlay.touchable {
      pointer-events: auto;
      cursor: pointer;
    }

    /* D-pad controls for touch devices */
    .dpad {
      display: none;
      margin: 20px auto 0;
      width: 180px;
      height: 180px;
      position: relative;
    }

    .dpad-btn {
      position: absolute;
      width: 56px;
      height: 56px;
      background: rgba(0, 212, 170, 0.15);
      border: 2px solid #00d4aa;
      border-radius: 12px;
      color: #00d4aa;
      font-size: 1.5rem;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.1s;
    }

    .dpad-btn:active {
      background: rgba(0, 212, 170, 0.4);
    }

    .dpad-up    { top: 0; left: 50%; transform: translateX(-50%); }
    .dpad-down  { bottom: 0; left: 50%; transform: translateX(-50%); }
    .dpad-left  { left: 0; top: 50%; transform: translateY(-50%); }
    .dpad-right { right: 0; top: 50%; transform: translateY(-50%); }

    .pause-btn {
      display: none;
      margin: 12px auto 0;
      padding: 10px 32px;
      background: rgba(0, 212, 170, 0.15);
      border: 2px solid #00d4aa;
      border-radius: 12px;
      color: #00d4aa;
      font-size: 1rem;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .pause-btn:active {
      background: rgba(0, 212, 170, 0.4);
    }

    @media (pointer: coarse) {
      .dpad, .pause-btn {
        display: block;
      }
      .instructions {
        display: none;
      }
      .touch-instructions {
        display: block;
      }
    }

    .touch-instructions {
      display: none;
      margin-top: 14px;
      font-size: 0.9rem;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="game-container">
    <h1>Snake Game</h1>
    <div class="score-board">
      <div>Score: <span id="score">0</span></div>
      <div>High Score: <span id="high-score">0</span></div>
    </div>
    <div style="position: relative; display: inline-block;">
      <canvas id="game-canvas" width="400" height="400"></canvas>
      <div class="overlay" id="overlay">
        <h2 id="overlay-title">Snake</h2>
        <p id="overlay-message">Press any arrow key or WASD to start</p>
      </div>
    </div>
    <div class="instructions">
      Arrow keys or WASD to move &bull; P to pause
    </div>
    <div class="touch-instructions">
      Swipe or use D-pad to move
    </div>
    <div class="dpad" id="dpad">
      <button class="dpad-btn dpad-up" data-dir="up">&#9650;</button>
      <button class="dpad-btn dpad-down" data-dir="down">&#9660;</button>
      <button class="dpad-btn dpad-left" data-dir="left">&#9664;</button>
      <button class="dpad-btn dpad-right" data-dir="right">&#9654;</button>
    </div>
    <button class="pause-btn" id="pause-btn">Pause</button>
  </div>

  <script>
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayMessage = document.getElementById('overlay-message');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('high-score');

    const GRID_SIZE = 20;
    const TILE_COUNT = canvas.width / GRID_SIZE;
    const TICK_RATE = 100; // ms per game tick

    let snake, direction, nextDirection, food, score, highScore, gameState, loopId;

    // Game states: 'waiting', 'running', 'paused', 'gameover'
    highScore = parseInt(localStorage.getItem('snakeHighScore') || '0', 10);
    highScoreEl.textContent = highScore;

    function init() {
      snake = [
        { x: Math.floor(TILE_COUNT / 2), y: Math.floor(TILE_COUNT / 2) }
      ];
      direction = { x: 0, y: 0 };
      nextDirection = { x: 0, y: 0 };
      score = 0;
      scoreEl.textContent = score;
      spawnFood();
      gameState = 'waiting';
      showOverlay('Snake', isTouchDevice() ? 'Swipe or tap a direction to start' : 'Press any arrow key or WASD to start');
      draw();
    }

    function isTouchDevice() {
      return window.matchMedia('(pointer: coarse)').matches;
    }

    function spawnFood() {
      while (true) {
        food = {
          x: Math.floor(Math.random() * TILE_COUNT),
          y: Math.floor(Math.random() * TILE_COUNT)
        };
        // Make sure food doesn't spawn on the snake
        if (!snake.some(seg => seg.x === food.x && seg.y === food.y)) break;
      }
    }

    function showOverlay(title, message, tappable) {
      overlayTitle.textContent = title;
      overlayMessage.textContent = message;
      overlay.style.display = 'flex';
      overlay.style.width = canvas.offsetWidth + 'px';
      overlay.style.height = canvas.offsetHeight + 'px';
      if (tappable) {
        overlay.classList.add('touchable');
      } else {
        overlay.classList.remove('touchable');
      }
    }

    function hideOverlay() {
      overlay.style.display = 'none';
    }

    function startGame() {
      gameState = 'running';
      hideOverlay();
      loopId = setInterval(tick, TICK_RATE);
    }

    function tick() {
      if (gameState !== 'running') return;

      direction = { ...nextDirection };

      const head = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
      };

      // Wall collision
      if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
        return gameOver();
      }

      // Self collision
      if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
        return gameOver();
      }

      snake.unshift(head);

      // Eat food
      if (head.x === food.x && head.y === food.y) {
        score++;
        scoreEl.textContent = score;
        if (score > highScore) {
          highScore = score;
          highScoreEl.textContent = highScore;
          localStorage.setItem('snakeHighScore', highScore);
        }
        spawnFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function gameOver() {
      clearInterval(loopId);
      gameState = 'gameover';
      showOverlay('Game Over', `Score: ${score} — ${isTouchDevice() ? 'Tap to restart' : 'Press any key to restart'}`, true);
    }

    function draw() {
      // Background
      ctx.fillStyle = '#16213e';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid lines (subtle)
      ctx.strokeStyle = '#1a2744';
      ctx.lineWidth = 0.5;
      for (let i = 0; i <= TILE_COUNT; i++) {
        ctx.beginPath();
        ctx.moveTo(i * GRID_SIZE, 0);
        ctx.lineTo(i * GRID_SIZE, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * GRID_SIZE);
        ctx.lineTo(canvas.width, i * GRID_SIZE);
        ctx.stroke();
      }

      // Food
      ctx.fillStyle = '#ff6b6b';
      ctx.shadowColor = '#ff6b6b';
      ctx.shadowBlur = 8;
      roundRect(food.x * GRID_SIZE + 1, food.y * GRID_SIZE + 1, GRID_SIZE - 2, GRID_SIZE - 2, 4);
      ctx.shadowBlur = 0;

      // Snake
      snake.forEach((seg, i) => {
        const ratio = 1 - (i / snake.length) * 0.5;
        const g = Math.floor(212 * ratio);
        const b = Math.floor(170 * ratio);
        ctx.fillStyle = `rgb(0, ${g}, ${b})`;
        if (i === 0) {
          ctx.shadowColor = '#00d4aa';
          ctx.shadowBlur = 6;
        }
        roundRect(seg.x * GRID_SIZE + 1, seg.y * GRID_SIZE + 1, GRID_SIZE - 2, GRID_SIZE - 2, 4);
        if (i === 0) ctx.shadowBlur = 0;
      });
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
      ctx.fill();
    }

    // Input handling
    document.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      const directionKeys = ['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d'];

      if (gameState === 'gameover') {
        init();
        return;
      }

      if (key === 'p' && (gameState === 'running' || gameState === 'paused')) {
        if (gameState === 'running') {
          gameState = 'paused';
          clearInterval(loopId);
          showOverlay('Paused', 'Press P to resume');
        } else {
          gameState = 'running';
          hideOverlay();
          loopId = setInterval(tick, TICK_RATE);
        }
        return;
      }

      if (gameState === 'waiting' && directionKeys.includes(key)) {
        setDirection(key);
        startGame();
        return;
      }

      if (gameState === 'running') {
        setDirection(key);
      }
    });

    function setDirection(key) {
      switch (key) {
        case 'arrowup':
        case 'w':
          if (direction.y !== 1) nextDirection = { x: 0, y: -1 };
          break;
        case 'arrowdown':
        case 's':
          if (direction.y !== -1) nextDirection = { x: 0, y: 1 };
          break;
        case 'arrowleft':
        case 'a':
          if (direction.x !== 1) nextDirection = { x: -1, y: 0 };
          break;
        case 'arrowright':
        case 'd':
          if (direction.x !== -1) nextDirection = { x: 1, y: 0 };
          break;
      }
    }

    // Touch / swipe handling
    let touchStartX = 0;
    let touchStartY = 0;

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      touchStartX = touch.clientX;
      touchStartY = touch.clientY;
    }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
      e.preventDefault();
      const touch = e.changedTouches[0];
      const dx = touch.clientX - touchStartX;
      const dy = touch.clientY - touchStartY;
      const absDx = Math.abs(dx);
      const absDy = Math.abs(dy);

      // Need a minimum swipe distance
      if (Math.max(absDx, absDy) < 20) return;

      let dir;
      if (absDx > absDy) {
        dir = dx > 0 ? 'right' : 'left';
      } else {
        dir = dy > 0 ? 'down' : 'up';
      }

      handleDirection(dir);
    }, { passive: false });

    // Overlay tap to restart
    overlay.addEventListener('touchend', (e) => {
      if (gameState === 'gameover') {
        e.preventDefault();
        e.stopPropagation();
        init();
      }
    });
    overlay.addEventListener('click', () => {
      if (gameState === 'gameover') init();
    });

    // D-pad buttons
    document.querySelectorAll('.dpad-btn').forEach(btn => {
      btn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        handleDirection(btn.dataset.dir);
      }, { passive: false });
      btn.addEventListener('click', () => {
        handleDirection(btn.dataset.dir);
      });
    });

    // Pause button
    document.getElementById('pause-btn').addEventListener('click', () => {
      if (gameState === 'running') {
        gameState = 'paused';
        clearInterval(loopId);
        showOverlay('Paused', 'Tap pause to resume');
      } else if (gameState === 'paused') {
        gameState = 'running';
        hideOverlay();
        loopId = setInterval(tick, TICK_RATE);
      }
    });

    function handleDirection(dir) {
      if (gameState === 'gameover') {
        init();
        return;
      }

      const keyMap = { up: 'arrowup', down: 'arrowdown', left: 'arrowleft', right: 'arrowright' };
      const key = keyMap[dir];
      if (!key) return;

      if (gameState === 'waiting') {
        setDirection(key);
        startGame();
        return;
      }

      if (gameState === 'running') {
        setDirection(key);
      }
    }

    // Responsive canvas sizing
    function resizeCanvas() {
      const maxSize = Math.min(window.innerWidth - 32, window.innerHeight - 300, 500);
      const size = Math.max(280, Math.floor(maxSize / TILE_COUNT) * TILE_COUNT);
      canvas.style.width = size + 'px';
      canvas.style.height = size + 'px';
      // Update overlay to match
      if (overlay.style.display === 'flex') {
        overlay.style.width = size + 'px';
        overlay.style.height = size + 'px';
      }
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Start
    init();
  </script>
</body>
</html>
